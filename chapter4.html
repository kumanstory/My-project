Saat Leon Belajar Bertanggung Jawab

  Sudah seminggu berlalu sejak malam itu. Malam ketika sebuah candaan berubah menjadi hubungan. Kini Leon dan Dewi resmi berpacaran, meski hubungan mereka hanya terjalin melalui layar ponsel.

Setiap malam mereka saling bertukar kabar. Mereka menanyakan hal-hal sederhana, seperti apakah sudah makan, sedang melakukan apa, atau sekadar saling mengirim emoji lucu.

Namun seiring berjalannya waktu, Leon justru merasa ada kekosongan di dalam hatinya. Setiap kali menerima pesan dari Dewi, ia merasakan sesuatu yang tidak selaras dalam dirinya.

Leon tahu bahwa Dewi adalah gadis yang baik dan tulus. Namun perasaannya sendiri belum benar-benar pulih. Bayangan Intan masih sesekali hadir dalam pikirannya. Hal itu membuat Leon merasa tidak adil, terutama terhadap Dewi.

Malam itu, setelah lama menatap layar ponselnya, Leon akhirnya memberanikan diri mengirim sebuah pesan.

Dengan hati-hati, Leon menulis,

"Aku boleh jujur malam ini?"

Tak lama kemudian, Dewi membalas.

"Tentu saja. Ada apa, Leon? Akhir-akhir ini kamu terlihat berbeda."

Leon menarik napas panjang sebelum mengetik balasan berikutnya.

"Aku mau minta maaf dulu. Mungkin selama ini aku sudah membuatmu berharap terlalu banyak."

Dewi terdiam beberapa saat sebelum menjawab.

"Kenapa kamu bilang begitu? Apa aku melakukan kesalahan?"

Leon segera membalas.

"Bukan. Kamu tidak salah sama sekali. Justru kamu orang yang sangat tulus. Tapi aku sadar, aku belum siap menjalani hubungan yang benar-benar serius. Aku takut pada akhirnya malah membuatmu kecewa."

Dewi kembali mengirim pesan.

"Aku mengerti, Leon. Tapi kenapa baru mengatakannya sekarang?"

Leon menatap layar beberapa detik sebelum menjawab.

"Karena aku tidak ingin menyakitimu dengan menghilang begitu saja. Aku hanya ingin jujur. Sampai saat ini aku belum bisa membuka hati sepenuhnya. Kamu pantas mendapatkan seseorang yang benar-benar siap. Bukan seseorang seperti aku yang masih berusaha berdamai dengan masa lalu."

Beberapa saat kemudian, balasan dari Dewi muncul.

"Aku sedih mendengarnya. Tapi aku menghargai kejujuranmu. Aku harap suatu hari nanti kamu menemukan kedamaian yang sedang kamu cari."

Leon tersenyum tipis.

"Terima kasih, Dewi. Dan sekali lagi, maaf karena membuat semuanya menjadi seperti ini."

Dewi memberikan balasan terakhirnya malam itu.

"Tidak apa-apa. Setidaknya sekarang aku tahu bahwa kamu tidak membohongi perasaanmu sendiri."

Setelah percakapan itu berakhir, keduanya sama-sama terdiam. Tidak ada pertengkaran. Tidak ada kemarahan. Bahkan tidak ada kata putus yang terucap.

Yang tersisa hanyalah pengertian. Sebuah jeda panjang yang menandai berakhirnya sesuatu yang mungkin memang tidak seharusnya dimulai.

Malam itu, Leon kembali menatap layar ponselnya dalam diam.

Ia menarik napas panjang, lalu membuka catatan pribadinya dan menulis satu kalimat.

"Kadang-kadang, kejujuran memang menyakitkan. Namun itulah bentuk tanggung jawab yang sesungguhnya."


`;
