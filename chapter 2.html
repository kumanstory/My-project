Setelah kelulusan, Leon memutuskan untuk tidak melanjutkan kuliah.
Bukan karena ia tak ingin, tapi karena tahu ibunya sudah terlalu lelah menanggung beban sendiri.
Ia memilih membantu di kios sayur milik ibunya — bangun pagi, menyiapkan dagangan, dan sesekali pergi ke pasar untuk membeli bahan tambahan.

Suatu siang, di tengah teriknya matahari, Leon berhenti di pinggir jalan untuk membeli beras di toko langganan.
Saat itulah ia melihat seorang gadis duduk di tepi jalan, di samping motor sport berwarna hitam yang tampak kehabisan bensin.
Raut wajahnya terlihat kesal tapi tetap tenang.

“Motor mogok?” tanya Leon pelan.
“Enggak, cuma kehabisan bensin… dan parahnya, aku lupa bawa dompet,” jawab gadis itu dengan tawa kecil, mencoba menutupi rasa malunya.

Leon hanya mengangguk, lalu tanpa banyak pikir, pergi membeli bensin eceran di warung dekat situ.
Saat ia kembali dan membantu mengisi tangki motor gadis itu, si gadis menatapnya dengan senyum yang lebar.
“Terima kasih ya. Aku Velly,” katanya sambil mengulurkan tangan.
“Leon,” jawabnya singkat seperti biasa.

Mereka sempat berbincang sebentar sebelum akhirnya bertukar nomor.
Sejak hari itu, mereka mulai sering berhubungan lewat pesan.
Velly orangnya supel, sedikit tomboy, dan gampang akrab dengan siapa saja.
Teman-temannya kebanyakan laki-laki, tapi entah kenapa Leon merasa nyaman dengannya — mungkin karena Velly lebih terbuka.

Malam-malam yang dulu sepi kini terasa lebih hidup.
Notifikasi pesan dari Velly menjadi hal yang selalu dinanti.
Dari obrolan ringan sampai curhat panjang, Leon merasa dirinya mulai menemukan alasan baru untuk tersenyum.
Tanpa sadar, ia mencoba membuka hati lagi — berharap hubungan itu bisa menutup kenangan lama dan membuka cerita baru.

  Hari-hari bersama Velly berjalan seperti biasanya — penuh canda, pesan singkat, dan obrolan larut malam yang dulu terasa hangat.
Namun belakangan, Leon mulai merasakan sesuatu yang aneh.
Bukan karena Velly yang berubah, tapi karena Leon yang mulai merasa sejak awal dirinya tidak pernah benar-benar spesial di hati gadis itu.

Velly sering membuat story foto saat nongkrong bersama teman-teman laki-lakinya.
Mereka tampak akrab, saling bercanda tanpa jarak.
Leon hanya menatap layar ponselnya lama, jari-jarinya mengetik pesan panjang lalu menghapusnya lagi sebelum terkirim.

Malam itu, notifikasi pesan dari Velly muncul.
"Maaf ya, tadi ga sempet bales. Lagi rame nongkrong."
Leon membacanya berkali-kali, merasa sesak tanpa tahu harus marah atau diam saja.

Ia mulai sering membalas dingin.
Kadang menuduh hal-hal kecil, kadang memilih tidak membalas sama sekali.
Bukan karena ingin menyakiti, tapi karena cemburu — perasaan yang tak bisa ia akui bahkan pada dirinya sendiri.

Velly sempat menanyakan perubahan sikapnya.
"Kamu kenapa sih, Leon? Akhir-akhir ini kayak beda."
Leon hanya menjawab pendek, "Nggak apa-apa."

Padahal di dalam hatinya, ia ingin berkata:
"Aku cemburu. Aku takut kehilangan kamu."
Tapi kata-kata itu seolah tersangkut di tenggorokan, tak pernah berhasil keluar.

Hari-hari berikutnya jadi dingin.
Percakapan mereka makin jarang, tawa makin sedikit, dan jarak perlahan tumbuh di antara keduanya — bukan karena jarak tempat, tapi jarak hati yang tak lagi saling mengerti.



Retak yang Terbuka

Setelah sekian lama, Leon merasa hubungannya dengan Velly semakin jauh. 
Percakapan yang dulu hangat kini terasa hambar, jarang ada canda, dan sering berakhir dengan diam yang menggantung. 
Ia mulai terbiasa menunggu pesan yang tak kunjung datang, dan menebak-nebak perasaan yang makin tak bisa ia pahami.

Suatu sore, Leon duduk di warung kopi dekat rumah, tempat biasa ia menenangkan pikiran. 
Angin sore membawa bau hujan, sementara ia hanya menatap gelas kopinya yang sudah dingin. 
Tak lama kemudian, Bayu—teman lamanya—datang dan duduk di hadapannya.

“Eh, Leon! Lama banget nggak ketemu!” sapa Bayu .  
Mereka berbincang ringan, mengenang masa lalu. 
Namun di tengah obrolan, Bayu tiba-tiba bertanya,  
“Eh, lo kenal nggak sama Velly, yang punya konter HP di kampung sebelah?”

Leon sempat terdiam. Ia pura-pura santai, lalu menjawab, “Enggak, kenapa emangnya?”  
Bayu tersenyum. “Hehe, gue jadian sama dia kemarin.”  
“Oh, gitu ya... selamat, Bay,” jawab Leon pelan, menahan sesuatu yang mendesak di dadanya.  
Ia menatap jauh ke luar warung, berusaha agar wajahnya tetap datar meski hatinya bergetar.

Malamnya, Leon duduk di kamar. Pikirannya tak tenang, dan akhirnya ia membuka chat Velly.

Leon: “Vel, aku mau nanya sesuatu.”  
Velly: “Hm? Kenapa tiba-tiba serius banget?”  
Leon: “Kamu kenal Bayu?”  
Velly: “Bayu yang mana?”  
Leon: “Yang punya bengkel .”

Hening. Tak ada balasan selama beberapa menit.  
Akhirnya pesan masuk.

Velly: “Kamu udah tau ya?”  
Leon: “Tau apa?”  
Velly: “Aku... aku lagi deket sama dia.”  
Leon: “Dekat atau pacaran?”  
Velly: “em..... udah pacaran.”

Jantung Leon berdegup keras.  
Matanya terasa panas, tapi ia memaksa dirinya tetap tenang.

Leon: “Kenapa, Vel? Aku salah apa?”  
Velly: “Kamu nggak salah, Leon. Aku cuma... ngerasa kita nggak cocok lagi. Kamu terlalu diam, terlalu dingin. Aku butuh seseorang yang bisa ngajak aku ketawa, keluar, ngerasa hidup.”  
Leon: “Jadi semua yang kita lewati cuma buat diakhiri kayak gini?”  
Velly: “Maaf... aku nggak bermaksud nyakitin kamu.”  
Leon: “Tapi kamu tetap nyakitin.”

Keheningan kembali menyelimuti layar.  
Tulisan “Velly sedang mengetik…” muncul lalu menghilang.

Velly: “Mungkin ini yang terbaik buat kita.”

Leon memandangi layar ponselnya lama, sebelum akhirnya mematikan lampu dan berbaring menatap langit-langit kamar.  
Untuk pertama kalinya, ia tidak mencoba menahan siapa pun.  
Ia membiarkan semuanya pergi—meski hatinya belum siap kehilangan.
